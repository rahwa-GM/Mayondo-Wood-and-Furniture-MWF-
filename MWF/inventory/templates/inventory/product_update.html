{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h2>{{ title }}</h2>
<form method="POST" novalidate>
    {% csrf_token %}
    <h4>Product Info</h4>
    {{ form | crispy }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'inventory:list_product' %}" class="btn btn-secondary">Cancel</a>

</form>
{% endblock %}
