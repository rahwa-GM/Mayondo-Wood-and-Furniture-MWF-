{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<!-- Breadcrumbs -->
<div class="d-flex justify-content-end mb-3">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="{% url 'accounts:dashboard_manager' %}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{% url 'sales:list_sale' %}">Sale List</a></li>
        <li class="breadcrumb-item active" aria-current="page">Add</li>
    </ol>
  </nav>
</div>
<h2>{{ title }}</h2>
<div class="container mt-4">
    <form method="POST" novalidate>
        {% csrf_token %}
        {{ form | crispy }}
        <button class="btn btn-primary">Save Sale</button>
        <a href="{% url 'sales:list_sale' %}" class="btn btn-secondary">Cancel</a>

    </form>
</div>
{% endblock %}
