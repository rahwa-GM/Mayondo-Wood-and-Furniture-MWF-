{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<!-- Breadcrumbs -->
<div class="d-flex justify-content-end mb-3">
  <nav aria-label="breadcrumb">
    <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="{% url 'accounts:dashboard_manager' %}">Dashboard</a></li>
        <li class="breadcrumb-item"><a href="{% url 'sales:list_customer' %}">Customer List</a></li>
        <li class="breadcrumb-item active" aria-current="page">Add</li>
    </ol>
  </nav>
</div>
<h2>{{ title }}</h2>
<form action = {% url 'sales:add_customer' %}  method="POST" novalidate>
    {% csrf_token %}
    {{ form | crispy }}
    <button type="submit" class="btn btn-success">Save</button>
    <a href="{% url 'sales:list_customer' %}" class="btn btn-secondary">Cancel</a>

</form>
{% endblock %}
