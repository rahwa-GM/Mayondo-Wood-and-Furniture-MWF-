{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mayondo Wood and Furniture (MWF)</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      height: 100vh;
      display: grid;
      place-items: center;
      background: url("{% static 'images/bg1.jpg' %}") no-repeat center center/cover;
    }

    .login-container {
      background-color: rgba(0,0,0,0.6);
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      max-width: 400px;
      width: 100%;
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      text-align: center;
    }

    .login-container img.logo {
      width: 100px;
      margin-bottom: 1rem;
    }

    .login-container h1 {
      margin-bottom: 2rem;
      font-weight: 500;
      font-size: 1.5rem;
    }

    .login-container form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .login-container input {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #fff;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .login-container input::placeholder {
      color: rgba(255,255,255,0.7);
    }

    .login-container .password-container {
      position: relative;
      width: 100%;
    }

    .login-container .password-container i {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #fff;
      font-size: 1.2rem;
      z-index: 2;
    }

    .login-container button {
      padding: 0.8rem 1rem;
      border: none;
      border-radius: 0.5rem;
      background-color: #fff;
      color: #000;
      font-weight: 500;
      cursor: pointer;
      font-size: 1rem;
    }

    .login-container .error-message {
      color: #ff6b6b;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 2rem;
      }
    }
  </style>
</head>
<body>

<div class="login-container">
  <!-- Company Logo -->
  <img src="{% static 'images/logo.jpg' %}" alt="MWF Logo" class="logo">

  <!-- Company Name -->
  <h1>Mayondo Wood and Furniture (MWF)</h1>
  <h3>Login Page</h3>
  

  {% if messages %}
    {% for message in messages %}
      <p class="error-message">{{ message }}</p>
    {% endfor %}
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <!-- Username -->
    {{ form.username }}

    <!-- Password -->
    <div class="password-container">
      {{ form.password }}
      <i class="ri-eye-off-line" id="toggle-password"></i>
    </div>

    <button type="submit">Login </button>
  </form>
</div>

<script>
  const passwordInput = document.getElementById("id_password");
  const togglePassword = document.getElementById("toggle-password");

  togglePassword.addEventListener('click', () => {
    if(passwordInput.type === 'password') {
      passwordInput.type = 'text';
      togglePassword.classList.remove('ri-eye-off-line');
      togglePassword.classList.add('ri-eye-line');
    } else {
      passwordInput.type = 'password';
      togglePassword.classList.remove('ri-eye-line');
      togglePassword.classList.add('ri-eye-off-line');
    }
  });
</script>

</body>
</html>
