<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MWF Login</title>
  <style>
    /* Dark wood theme colors */
    :root {
      --wood-900: #2b1f14;
      --wood-800: #3a2a1f;
      --wood-700: #4a3528;
      --cream-100: #f6efe6;
      --cream-300: #e6d7c8;
      --amber-500: #d69e2e;
      --amber-600: #c18f2a;
    }

    body {
      margin: 0;
      font-family: sans-serif;
      background-color: var(--wood-900);
      color: var(--cream-100);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background-color: var(--wood-800);
      padding: 40px;
      border-radius: 12px;
      width: 350px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 24px;
      font-weight: bold;
    }

    p {
      margin-bottom: 20px;
      color: var(--cream-300);
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      background-color: var(--wood-700);
      color: var(--cream-100);
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid var(--amber-500);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--amber-500);
      color: var(--wood-900);
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 16px;
    }

    button:hover {
      background-color: var(--amber-600);
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: var(--cream-300);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Mayondo Wood & Furniture</h1>
    <p>Login to your account</p>
    <form>
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div class="footer">&copy; 2025 MWF Ltd. All rights reserved.</div>
  </div>
</body>
</html>
