{% extends "base.html" %}
{% block content %}
<h2>Confirm Delete</h2>
<p>Are you sure you want to delete {{ staff_to_delete.user.get_full_name }}?</p>
<form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'staff:list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
